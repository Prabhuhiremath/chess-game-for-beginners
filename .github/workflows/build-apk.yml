name: Build APK

# Builds the debug APK and publishes it as a downloadable artifact.
# Run automatically on pushes/PRs, or manually from the Actions tab
# (Actions -> Build APK -> Run workflow).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode debug keystore
        # The debug keystore is committed (base64-encoded) because the debug
        # build type is signed with a fixed "debugConfig" signing config.
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-kids-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
